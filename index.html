const lib=u=>new Promise((r,j)=>{const s=document.createElement('script');s.src=u;s.onload=r;s.onerror=()=>j(new Error('تعذر تحميل مكتبة القراءة، تأكد من الإنترنت.'));document.head.appendChild(s)});
async function readPdf(f){
  if(!window.pdfjsLib){await lib('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}
  const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let t='';
  for(let i=1;i<=Math.min(pdf.numPages,100);i++){const c=await(await pdf.getPage(i)).getTextContent();t+=c.items.map(x=>x.str+(x.hasEOL?'\n':' ')).join('')+'\n'}
  return t;
}
async function readPptx(f){
  if(!window.JSZip)await lib('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
  const z=await JSZip.loadAsync(f),ns=Object.keys(z.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>a.match(/\d+/)[0]-b.match(/\d+/)[0]);let t='';
  for(const n of ns)t+=(await z.files[n].async('string')).replace(/<\/a:p>/g,'\n').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&amp;/g,'&')+'\n';
  return t;
}
const STOP=new Set('this that with from have been were which their there about these those would could should after before between because however also into than then them they what when where while using used such other more most some many each both only very'.split(' '));
function makeItems(t){
  const seen=new Set(),out=[];
  t.replace(/[ \t]+/g,' ').split(/[.!?؟\n]+/).map(s=>s.trim()).filter(s=>s.length>=25&&s.length<=240).forEach(s=>{
    const m=s.match(/^(.{2,50}?)\s+(?:is|are|means|refers to|is defined as|هو|هي|هم|يعرف بأنه|تعرف بأنها|يسمى|تسمى|عبارة عن)\s+(.{12,})$/i);let it;
    if(m)it={k:'d',q:'ما المقصود بـ «'+m[1].trim()+'»؟',a:m[2].trim().slice(0,150),s};
    else{
      const w=(s.match(/[A-Za-z0-9\u0600-\u06FF][A-Za-z0-9\u0600-\u06FF\-]{3,}/g)||[]).filter(x=>!STOP.has(x.toLowerCase()));
      if(!w.length)return;
      const k=w.find(x=>/^[A-Z0-9]/.test(x)&&s.indexOf(x)>0)||w.sort((a,b)=>b.length-a.length)[0];
      it={k:'c',q:s.replace(k,'_____'),a:k,s};
    }
    if(!seen.has(it.a)){seen.add(it.a);out.push(it)}
  });
  return out;
}

/* ---------- البطاقات ---------- */
function study(id){
  const d=decks.find(x=>x.id===id);if(!d)return deckList();
  d.last=Date.now();persist(d);S={d,i:0,order:d.cards.map((_,i)=>i)};
  return `<div class="study"><div class="head" style="margin:0"><h2 style="font-size:1.3rem">${esc(d.name)}</h2><div class="row"><button class="btn sm alt" onclick="S.order=shuffle(S.order);S.i=0;draw()">خلط</button><button class="btn sm alt" onclick="onlyHard()">الصعبة فقط</button><button class="btn sm alt" onclick="S.order=S.d.cards.map((_,i)=>i);S.i=0;draw()">إعادة</button></div></div><div id="sv"></div></div>`;
}
function onlyHard(){const h=S.d.hard||[],o=S.d.cards.map((c,i)=>h.includes(c[0])?i:-1).filter(i=>i>=0);if(!o.length){toast('لم تعلّم أي بطاقة كصعبة');return}S.order=o;S.i=0;draw()}
function hard(){const d=S.d,q=d.cards[S.order[S.i]][0],h=d.hard||(d.hard=[]),k=h.indexOf(q);k<0?h.push(q):h.splice(k,1);persist(d);draw()}
function draw(){
  const c=S.d.cards[S.order[S.i]],n=S.order.length,h=(S.d.hard||[]).includes(c[0]);
  $('#sv').innerHTML=`<div class="prog"><b style="width:${(S.i+1)/n*100}%"></b></div><div class="meta"><span>بطاقة ${S.i+1} من ${n}</span><button class="link" onclick="hard()">${h?'★ صعبة':'☆ علّم كصعبة'}</button></div>
  <div class="scene" style="margin-top:14px"><button class="flip3d" id="sc" onclick="this.classList.toggle('on')" aria-label="اقلب البطاقة"><div class="face front"><small>المصطلح</small>${esc(c[0])}</div><div class="face back"><small>التعريف</small>${esc(c[1])}</div></button></div>
  <div class="ctrl"><button class="btn alt" onclick="step(-1)" ${S.i===0?'disabled':''}>السابق</button><button class="btn alt" onclick="$('#sc').classList.toggle('on')">اقلب</button>${S.i<n-1?'<button class="btn" onclick="step(1)">التالي</button>':`<button class="btn gold" onclick="go('learn','${S.d.id}')">ابدأ التعلّم</button>`}</div>`;
}
const step=k=>{S.i=Math.max(0,Math.min(S.order.length-1,S.i+k));draw()};
let tx=0;
document.addEventListener('touchstart',e=>{tx=e.changedTouches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(cur==='study'&&S&&Math.abs(dx)>70)step(dx<0?1:-1)},{passive:true});
document.addEventListener('keydown',e=>{
  if(cur!=='study'||!S||/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==='ArrowLeft')step(1);else if(e.key==='ArrowRight')step(-1);
  else if(e.key===' '){e.preventDefault();const s=$('#sc');s&&s.classList.toggle('on')}
});

function opts(it,d){
  const rest=[...(d.ans||[]).map(x=>x.a),...d.cards.map(c=>c[1]),...decks.flatMap(x=>x.cards.map(c=>c[1]))].filter(a=>a!==it.a);
  return shuffle([it.a,...[...new Set(shuffle(rest))].slice(0,3)]);
}
function learn(id){
  const d=decks.find(x=>x.id===id);if(!d)return deckList();
  if(d.cards.length<2)return '<div class="empty">تحتاج إلى بطاقتين على الأقل.</div>';
  d.last=Date.now();persist(d);
  L={d,q:shuffle(d.cards.map(c=>({q:c[0],a:c[1],s:c[2]}))),n:d.cards.length,done:0,first:0,tries:0};
  return '<div class="quiz"><div id="lv"></div></div>';
}
function drawL(){
  if(!L.q.length){$('#lv').innerHTML=`<div class="panel score"><div class="n">${L.first}/${L.n}</div><h2>أكملت الجلسة</h2><p class="sub" style="margin:0 auto 20px">إجابات صحيحة من المحاولة الأولى. عدد المحاولات: ${L.tries}</p><div class="row" style="justify-content:center"><button class="btn" onclick="go('learn','${L.d.id}')">جلسة جديدة</button><button class="btn alt" onclick="go('set','${L.d.id}')">رجوع للشيت</button></div></div>`;return}
  const it=L.q[0];
  if(!it.o){it.o=opts(it,L.d);it.t=(it.o.length<3||(it.a.length<=30&&Math.random()<.5))?'w':'m'}
  $('#lv').innerHTML=`<div class="prog"><b style="width:${L.done/L.n*100}%"></b></div><div class="meta"><span>تم إتقان ${L.done} من ${L.n}</span><span>${it.t==='m'?'اختر الإجابة':'اكتب الإجابة'}</span></div><p class="q">${esc(it.q)}</p>`+
  (it.t==='m'?it.o.map((o,k)=>`<button class="opt" onclick="ansL(${k})">${esc(o)}</button>`).join(''):'<input type="text" id="wa" autocomplete="off" placeholder="اكتب إجابتك" onkeydown="if(event.key===\'Enter\')ansL()"><button class="btn" id="wb" style="margin-top:10px" onclick="ansL()">تحقق</button>')+'<div id="nx"></div>';
  if(it.t==='w')$('#wa').focus();
}
function ansL(k){
  const it=L.q[0],w=it.t==='w';
  if(w&&!$('#wa').value.trim())return;
  const v=w?$('#wa').value:it.o[k],ok=norm(v)===norm(it.a);
  L.tries++;if(ok){L.done++;if(!it.miss)L.first++}else it.miss=1;
  L.q.shift();if(!ok){it.o=null;L.q.push(it)}
  if(w){$('#wa').disabled=true;$('#wb').hidden=true}
  else document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(it.o&&it.o[j]===it.a)b.classList.add('good');else if(j===k)b.classList.add('wrong')});
  $('#nx').innerHTML=(ok?'<div class="exp ok">إجابة صحيحة</div>':`<div class="exp"><b>الإجابة الصحيحة:</b> ${esc(it.a)}${it.s?'<br>'+expl(it):''}</div>`)+`<button class="btn" style="margin-top:10px" onclick="drawL()">${L.q.length?'التالي':'عرض النتيجة'}</button>`;
}

/* ---------- الاختبار ---------- */
function test(id){
  const d=decks.find(x=>x.id===id);if(!d)return deckList();
  const n=d.cards.length;T0=id;
  return `<div class="quiz"><div class="panel"><h2>اختبار تجريبي</h2><p class="sub">${esc(d.name)}</p><label for="tn">عدد الأسئلة (حتى ${n})</label><input type="number" id="tn" min="1" max="${n}" value="${Math.min(10,n)}"><label for="tt">المؤقت بالدقائق (اختياري)</label><input type="number" id="tt" min="1" max="180"><div class="row" style="margin-top:16px"><button class="btn" onclick="startTest()">ابدأ الاختبار</button><button class="btn alt" onclick="go('set','${id}')">رجوع</button></div></div></div>`;
}
function startTest(){
  const d=decks.find(x=>x.id===T0),n=Math.max(1,Math.min(d.cards.length,+$('#tn').value||10)),m=+$('#tt').value||0;
  const pool=[...new Set([...(d.ans||[]).map(x=>x.a),...d.cards.map(c=>c[1]),...decks.flatMap(x=>x.cards.map(c=>c[1]))])];
  const list=shuffle(d.cards).slice(0,n).map(c=>{
    const it={q:c[0],a:c[1],s:c[2]},r=Math.random(),w=pool.filter(p=>p!==it.a);
    if(r<.4&&w.length>=3){it.t='m';it.o=shuffle([it.a,...shuffle(w).slice(0,3)])}
    else if(r<.7||it.a.length>40){it.t='t';it.sh=(Math.random()<.5||!w.length)?it.a:shuffle(w)[0]}
    else it.t='w';
    return it});
  d.last=Date.now();persist(d);
  Q={d,list,i:0,ans:list.map(()=>null),end:m?Date.now()+m*60000:0,done:0};
  $('#app').innerHTML='<div class="quiz"><div id="qv"></div></div>';
  if(Q.end)Q.tm=setInterval(tick,1000);
  drawT();
}
function tick(){
  if(!Q||!Q.end||Q.done)return;const r=Q.end-Date.now();
  if(r<=0){submitT();return}
  const e=$('#tm');if(e)e.textContent=Math.floor(r/60000)+':'+String(Math.floor(r/1000)%60).padStart(2,'0');
}
function drawT(){
  const n=Q.list.length,it=Q.list[Q.i],a=Q.ans[Q.i];let b='';
  if(it.t==='m')b=it.o.map((o,k)=>`<button class="opt ${a===o?'sel':''}" onclick="setA(${k})">${esc(o)}</button>`).join('');
  else if(it.t==='t')b=`<p class="sub" style="margin-bottom:10px">هل هذا التعريف صحيح لهذا المصطلح؟</p><div class="exp" style="margin:0 0 12px">${esc(it.sh)}</div><div class="row"><button class="opt ${a===true?'sel':''}" style="flex:1" onclick="setA(true)">صح</button><button class="opt ${a===false?'sel':''}" style="flex:1" onclick="setA(false)">خطأ</button></div>`;
  else b=`<input type="text" id="wa" autocomplete="off" value="${esc(a||'')}" placeholder="اكتب إجابتك" oninput="Q.ans[Q.i]=this.value">`;
  $('#qv').innerHTML=`<div class="prog"><b style="width:${(Q.i+1)/n*100}%"></b></div><div class="meta"><span>سؤال ${Q.i+1} من ${n}</span><span id="tm"></span></div><p class="q">${esc(it.q)}</p>${b}<div class="ctrl"><button class="btn alt" onclick="Q.i--;drawT()" ${Q.i?'':'disabled'}>السابق</button>${Q.i<n-1?'<button class="btn" onclick="Q.i++;drawT()">التالي</button>':'<button class="btn gold" onclick="submitT()">تسليم</button>'}</div>`;
  tick();
}
function setA(k){const it=Q.list[Q.i];Q.ans[Q.i]=it.t==='m'?it.o[k]:k;drawT()}
const good=(it,a)=>it.t==='m'?a===it.a:it.t==='t'?a===(it.sh===it.a):norm(a||'')===norm(it.a);
const yn=v=>v===true?'صح':v===false?'خطأ':'بدون إجابة';
function submitT(){
  if(Q.done)return;Q.done=1;clearInterval(Q.tm);
  const n=Q.list.length,bad=Q.list.map((it,i)=>[it,Q.ans[i]]).filter(([it,a])=>!good(it,a)),s=n-bad.length,p=Math.round(s/n*100);
  $('#qv').innerHTML=`<div class="panel score"><div class="n">${s}/${n}</div><h2>${p>=80?'ممتاز':p>=50?'جيد، واصل المراجعة':'تحتاج مراجعة أكثر'}</h2><p class="sub" style="margin:0 auto 20px">النتيجة: ${p}%</p><div class="row" style="justify-content:center"><button class="btn" onclick="go('test','${Q.d.id}')">إعادة الاختبار</button><button class="btn alt" onclick="go('set','${Q.d.id}')">رجوع للشيت</button></div></div>
  ${bad.length?`<h2 class="sec">راجع أخطاءك (${bad.length})</h2>`+bad.map(([it,a])=>`<div class="rv"><p class="q2">${esc(it.q)}</p>${it.t==='t'?`<p class="why">التعريف المعروض: ${esc(it.sh)}</p>`:''}<p class="no">إجابتك: ${esc(it.t==='t'?yn(a):(a||'بدون إجابة'))}</p><p class="yes">الصحيحة: ${esc(it.t==='t'?yn(it.sh===it.a):it.a)}</p>${it.t==='t'?`<p class="why">التعريف الصحيح: ${esc(it.a)}</p>`:''}${it.s?`<p class="why">${expl(it)}</p>`:''}</div>`).join(''):'<p class="sub" style="text-align:center;margin:20px auto">أحسنت! لم ترتكب أي خطأ.</p>'}`;
}

/* ---------- المطابقة ---------- */
function match(id){
  const d=decks.find(x=>x.id===id);if(!d)return deckList();
  if(d.cards.length<2)return '<div class="empty">تحتاج إلى بطاقتين على الأقل.</div>';
  const cs=shuffle(d.cards).slice(0,6);
  M={d,t:shuffle([...cs.map((c,i)=>({i,x:c[0]})),...cs.map((c,i)=>({i,x:c[1]}))]),sel:null,bad:null,done:0,n:cs.length,att:0,t0:Date.now(),fin:0};
  M.tm=setInterval(()=>{const e=$('#mt');if(e&&!M.fin)e.textContent=Math.floor((Date.now()-M.t0)/1000)+' ث'},500);
  return `<div class="study" style="max-width:640px"><div class="head" style="margin:0"><h2 style="font-size:1.3rem">مطابقة: ${esc(d.name)}</h2><button class="btn sm alt" onclick="go('match','${id}')">إعادة</button></div><div class="meta" style="margin-top:10px"><span id="mt">0 ث</span><span id="ma">المحاولات: 0</span></div><div class="mgrid" id="mg"></div></div>`;
}
function mdraw(){
  $('#mg').innerHTML=M.t.map((t,k)=>`<button class="mt${t.g?' g':''}${M.sel===k?' s':''}${M.bad&&M.bad.includes(k)?' b':''}" onclick="mpick(${k})">${esc(t.x)}</button>`).join('');
  $('#ma').textContent='المحاولات: '+M.att;
}
function mpick(k){
  const t=M.t[k];if(t.g||M.sel===k||M.bad)return;
  if(M.sel===null){M.sel=k;mdraw();return}
  const o=M.t[M.sel];M.att++;
  if(o.i===t.i){o.g=t.g=1;M.done++;M.sel=null;mdraw();
    if(M.done===M.n){M.fin=1;clearInterval(M.tm);const s=Math.floor((Date.now()-M.t0)/1000);
      $('#mg').outerHTML=`<div class="panel score"><div class="n">${s} ث</div><h2>أحسنت، أكملت المطابقة</h2><p class="sub" style="margin:0 auto 20px">عدد المحاولات: ${M.att}</p><div class="row" style="justify-content:center"><button class="btn" onclick="go('match','${M.d.id}')">العب مجدداً</button><button class="btn alt" onclick="go('set','${M.d.id}')">رجوع للشيت</button></div></div>`}}
  else{M.bad=[M.sel,k];M.sel=null;mdraw();setTimeout(()=>{M.bad=null;if($('#mg'))mdraw()},600)}
}
/* ---------- واجهة التطبيق ---------- */
const svg=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I={home:svg('<path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>'),plus:svg('<path d="M12 5v14M5 12h14"/>'),folder:svg('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'),file:svg('<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/>'),text:svg('<path d="M4 6h16M4 12h16M4 18h10"/>'),kb:svg('<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/>')};
const A={set:'decks',folder:'decks',study:'decks',learn:'decks',test:'decks',match:'decks',nsub:'decks',imp:'new',edit:'new'};
let Pm=0,Lt='sets';
const deckCard=d=>`<button class="lrow" onclick="go('set','${d.id}')"><span class="ic">${I.file}</span><div><b>${d.fav?'★ ':''}${esc(d.name)}</b><small>${d.folder?esc(d.folder)+' · ':''}${d.cards.length} بطاقة</small></div></button>`;
async function saveFolders(){const{error}=await sb.auth.updateUser({data:{folders:user.folders}});if(error)toast('تعذر حفظ المواد')}
function home(){
  const rec=decks.filter(d=>d.last).sort((a,b)=>b.last-a.last).slice(0,4),mine=decks.slice().sort((a,b)=>(b.last||0)-(a.last||0)).slice(0,6);
  return `<h1 style="font-size:clamp(1.6rem,4.5vw,2.4rem);margin-top:8px">مرحباً ${esc((user.name||'').split(' ')[0])}</h1>
  <div class="panel" style="margin-top:16px"><h3 style="margin-bottom:6px">حوّل ملفاتك إلى بطاقات</h3><p class="sub" style="margin-bottom:14px">ارفع PDF أو DOCX أو PowerPoint، أو ألصق نصاً، واختر عدد البطاقات والأسئلة.</p><button class="btn" onclick="go('new')">إنشاء شيت</button></div>
  ${rec.length?`<h3 class="sec">تابع المذاكرة</h3><div class="grid">${rec.map(deckCard).join('')}</div>`:''}
  <h3 class="sec">شيتاتك</h3>${mine.length?`<div class="grid">${mine.map(deckCard).join('')}</div>`:noSets}
  ${decks.length>6?'<p style="margin-top:16px"><button class="link" onclick="go(\'decks\')">عرض الكل</button></p>':''}`;
}
function newv(){
  const c=(t,s,i,o)=>`<button class="opt hub" onclick="${o}"><span class="ic">${I[i]}</span><b>${t}</b><small>${s}</small></button>`;
  return `<h2 style="margin-top:12px;text-align:center">إنشاء</h2><div class="hubg">${c('ارفع ملفاً','PDF · DOCX · PPTX','file',"Pm=0;Fd='';go('imp')")}${c('ألصق نصاً','من ملاحظاتك','text',"Pm=1;Fd='';go('imp')")}${c('يدوياً','اكتب المصطلحات','kb',"Fd='';go('edit')")}${c('مادة جديدة','لتنظيم شيتاتك','folder',"go('nsub')")}</div>`;
}
function nsub(){
  return `<div class="auth"><div class="panel" style="text-align:center"><span class="ic big">${I.folder}</span><h2 style="margin:14px 0">مادة جديدة</h2><input type="text" id="ns" placeholder="اسم المادة" style="text-align:center"><p class="err" id="er"></p><button class="btn" style="width:100%" onclick="newSubj()">إنشاء المادة</button></div></div>`;
}
async function newSubj(){
  const n=$('#ns').value.trim(),er=$('#er');
  if(!n){er.textContent='اكتب اسم المادة.';return}
  if(subj()[n]){er.textContent='هذه المادة موجودة بالفعل.';return}
  user.folders=[...(user.folders||[]),n];await saveFolders();go('folder',enc(n));
}
function deckList(){
  return `<div class="head"><h2>المكتبة</h2></div>
  <div class="chips"><button class="chip ${Lt==='sets'?'on':''}" onclick="Lt='sets';go('decks')">الشيتات</button><button class="chip ${Lt==='folders'?'on':''}" onclick="Lt='folders';go('decks')">المواد</button></div>
  <div class="tools"><input type="text" id="lq" placeholder="ابحث" value="${esc(Lq)}" oninput="Lq=this.value;renderLib()">${Lt==='sets'?`<select id="ls" aria-label="ترتيب" onchange="Ls=this.value;renderLib()">${[['recent','الأحدث'],['name','الاسم'],['size','الحجم'],['fav','المفضلة']].map(([v,t])=>`<option value="${v}"${v===Ls?' selected':''}>${t}</option>`).join('')}</select>`:''}</div><div id="lib" class="grid"></div>`;
}
function renderLib(){
  const q=norm(Lq),S0=subj();
  if(Lt==='folders'){
    const ns=Object.keys(S0).filter(n=>!q||norm(n).includes(q)).sort((a,b)=>a.localeCompare(b,'ar'));
    $('#lib').innerHTML=`<button class="lrow add" onclick="go('nsub')"><span class="ic">${I.plus}</span><div><b>مادة جديدة</b></div></button>`+ns.map(n=>`<button class="lrow" onclick="go('folder','${enc(n)}')"><span class="ic">${I.folder}</span><div><b>${esc(n)}</b><small>مادة · ${S0[n].length} شيت</small></div></button>`).join('');return;
  }
  let l=decks.filter(d=>!q||norm(d.name+' '+(d.folder||'')+' '+(d.desc||'')+' '+d.cards.map(c=>c[0]+' '+c[1]).join(' ')).includes(q));
  if(Ls==='fav')l=l.filter(d=>d.fav);
  l.sort(Ls==='name'?(a,b)=>a.name.localeCompare(b.name,'ar'):Ls==='size'?(a,b)=>b.cards.length-a.cards.length:(a,b)=>(b.last||0)-(a.last||0));
  $('#lib').innerHTML=l.length?l.map(deckCard).join(''):(decks.length?'<div class="empty">لا توجد نتائج مطابقة.</div>':noSets);
}
function folder(e){
  F=decodeURIComponent(e);const l=decks.filter(d=>d.folder===F),b=`<button class="btn" onclick="goIn('imp','${e}')">أضف مواد دراسية</button><button class="btn alt" onclick="goIn('edit','${e}')">شيت يدوي</button>`;
  return `<div style="text-align:center;margin-top:14px"><span class="ic big">${I.folder}</span><h2 style="margin-top:14px">${esc(F)}</h2><p class="sub" style="margin:auto">${l.length} شيت</p></div>
  ${l.length?`<div class="row" style="justify-content:center;margin-top:16px">${b}</div><div class="grid">${l.map(deckCard).join('')}</div>`:`<div class="panel" style="text-align:center"><h3 style="margin:6px 0 16px">لنبدأ بناء مادتك</h3><div class="row" style="justify-content:center">${b}</div></div>`}
  <div class="row" style="justify-content:center;margin-top:22px"><button class="btn sm alt" onclick="renSubj()">إعادة تسمية</button><button class="btn sm alt" onclick="delSubj()">حذف المادة</button></div>`;
}
function imp(){
  return `<h2 style="margin-top:12px">${Pm?'ألصق نصاً':'ارفع ملفاً'}</h2><p class="sub">${Pm?'ألصق ملاحظاتك':'PDF أو DOCX أو PowerPoint'}، وتُستخرج الأسئلة من محتواها فقط.</p><div class="panel"><label for="fo">المادة</label><input type="text" id="fo" list="sl" placeholder="مثال: أمراض الدم" value="${esc(Fd)}">${dl()}
  ${Pm?'<label for="pn">اسم الشيت</label><input type="text" id="pn"><label for="pt">النص</label><textarea id="pt" style="min-height:160px"></textarea>':'<label for="f">الملف</label><input type="file" id="f" accept=".pdf,.docx,.pptx">'}
  <div class="two"><div><label for="nf">عدد الفلاش كارد</label><input type="number" id="nf" value="10" min="1" max="200"></div><div><label for="nq">عدد أسئلة الكويز</label><input type="number" id="nq" value="10" min="1" max="200"></div></div>
  <p class="err" id="er"></p><button class="btn" id="gb" onclick="gen()">إنشاء الشيت</button></div>`;
}
async function readDocx(f){
  if(!window.JSZip)await lib('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
  const z=await JSZip.loadAsync(f),x=z.files['word/document.xml'];if(!x)throw new Error('ملف DOCX غير صالح.');
  return (await x.async('string')).replace(/<\/w:p>/g,'\n').replace(/<w:tab\/>/g,' ').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&amp;/g,'&');
}
async function gen(){
  const fo=$('#fo').value.trim(),f=Pm?null:$('#f').files[0],er=$('#er'),nf=Math.max(1,+$('#nf').value||10),nq=Math.max(1,+$('#nq').value||10),tx=Pm?$('#pt').value:'';let ext='';
  if(!fo){er.textContent='اكتب اسم المادة.';return}
  if(Pm){if(tx.trim().length<40){er.textContent='ألصق نصاً أطول (40 حرفاً على الأقل).';return}}
  else{
    if(!f){er.textContent='اختر ملف PDF أو DOCX أو PPTX.';return}
    ext=f.name.split('.').pop().toLowerCase();
    if(!['pdf','docx','pptx'].includes(ext)){er.textContent='الصيغ المدعومة: PDF وDOCX وPPTX.';return}
  }
  const b=$('#gb');b.disabled=true;er.style.color='var(--soft)';er.textContent='جارٍ قراءة المحتوى...';
  try{
    const pool=makeItems(Pm?tx:await(ext==='pdf'?readPdf(f):ext==='pptx'?readPptx(f):readDocx(f)));
    if(pool.length<4)throw new Error('لم نجد نصاً كافياً. تأكد أن المحتوى نصي وليس صوراً ممسوحة.');
    const all=shuffle(pool).slice(0,Math.max(nf,nq));
    await saveDeck({folder:fo,name:Pm?($('#pn').value.trim()||'نص ملصق'):f.name.replace(/\.\w+$/,''),cards:all.slice(0,nf).map(i=>[qtxt(i),i.a,i.s]),qz:all.slice(0,nq),ans:pool.map(i=>({a:i.a,k:i.k}))});
    toast(all.length<Math.max(nf,nq)?'المحتوى يكفي لـ '+all.length+' عنصراً فقط':'تم إنشاء الشيت');go('folder',enc(fo));
  }catch(e){b.disabled=false;er.style.color='';er.textContent=e.message||'تعذرت القراءة.'}
}
init();
</script>
