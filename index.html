<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="theme-color" content="#0f1420">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--ink:#e8ecf7;--soft:#98a1bd;--bg:#0f1420;--card:#171d2e;--line:#2a3350;--brand:#6459f0;--brand-d:#5248dd;--tint:#222a47;--gold:#f2b134;--ok:#2fbf8f;--okbg:#12382d;--bad:#f0626c;--badbg:#3f1f29;--r:16px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:'IBM Plex Sans Arabic',Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
header{position:sticky;top:0;z-index:10;background:rgba(15,20,32,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1040px;margin:auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-weight:700;font-size:1.4rem;letter-spacing:.2px;background:none;border:0;display:flex;align-items:center;gap:8px}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--brand);display:grid;place-items:center;color:#fff;font-style:normal;font-size:1.1rem}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{background:none;border:0;padding:6px 14px;border-radius:999px;color:var(--soft);font-weight:500;white-space:nowrap}
nav button:hover{background:var(--tint)}
nav button.on{background:var(--brand);color:#fff}
nav button.vip{color:var(--gold);font-weight:600}
nav button.vip.on{background:var(--gold);color:#1a1400}
main{max-width:1040px;margin:auto;padding:28px 20px 80px}
h1{font-size:clamp(2rem,5.5vw,3.3rem);line-height:1.35;font-weight:700}
h2{font-size:1.6rem;margin-bottom:6px}
.sub{color:var(--soft);max-width:48ch}
.btn{border:0;border-radius:12px;padding:11px 22px;font-weight:600;background:var(--brand);color:#fff;transition:background .15s,transform .1s}
.btn:hover{background:var(--brand-d)}
.btn:active{transform:scale(.97)}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.alt:hover{background:var(--tint)}
.btn.gold{background:var(--gold);color:#1a1400}
.btn.sm{padding:6px 14px;font-size:.92rem}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:28px 0 20px}
.hero .sub{margin:16px 0 26px;font-size:1.1rem}
.row{display:flex;gap:10px;flex-wrap:wrap}
.scene{perspective:1100px}
.flip3d{position:relative;height:300px;cursor:pointer;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.2,1);border:0;background:none;width:100%;display:block}
.flip3d.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:1.35rem;font-weight:600;line-height:1.7}
.face small{position:absolute;top:16px;font-size:.85rem;font-weight:500;opacity:.7}
.front{background:var(--card);border:1.5px solid var(--line);box-shadow:0 18px 40px -22px rgba(22,33,62,.35)}
.back{background:var(--brand);color:#fff;transform:rotateY(180deg);box-shadow:0 18px 40px -22px rgba(79,70,229,.7)}
.hint{text-align:center;color:var(--soft);font-size:.9rem;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:22px}
.deck{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:6px}
.deck h3{font-size:1.15rem}
.deck p{color:var(--soft);font-size:.92rem;margin-bottom:10px}
.deck .row{margin-top:auto}
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-top:12px}
.empty{text-align:center;padding:50px 20px;color:var(--soft);background:var(--card);border:1.5px dashed var(--line);border-radius:var(--r);margin-top:22px}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:24px;margin-top:22px}
label{display:block;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=file],textarea{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg)}
textarea{min-height:200px;resize:vertical;line-height:1.9}
.err{color:var(--bad);font-weight:500;margin-top:12px;min-height:1.5em}
.study{max-width:560px;margin:22px auto 0}
.study .flip3d{height:340px}
.ctrl{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:10px}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0}
.prog b{display:block;height:100%;background:var(--brand);transition:width .3s;border-radius:99px}
.meta{display:flex;justify-content:space-between;color:var(--soft);font-size:.92rem}
.quiz{max-width:640px;margin:22px auto 0}
.q{font-size:1.4rem;font-weight:600;margin:18px 0}
.opt{display:block;width:100%;text-align:start;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 18px;margin-bottom:10px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--brand);background:var(--tint)}
.opt.good{background:var(--okbg);border-color:var(--ok);color:#9af2d0}
.opt.wrong{background:var(--badbg);border-color:var(--bad);color:#ffb9be}
.opt:disabled{cursor:default}
.score{text-align:center;padding:30px 10px}
.score .n{font-size:4rem;font-weight:700;color:var(--brand);line-height:1.2}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-top:24px}
.plan{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:26px}
.plan.v{background:#1d2347;border-color:var(--gold)}
.price{font-size:2.4rem;font-weight:700;margin:6px 0}
.price small{font-size:1rem;font-weight:400;opacity:.7}
.plan ul{list-style:none;padding:0;margin:14px 0 22px}
.plan li{padding:5px 0 5px 0;display:flex;gap:10px}
.plan li:before{content:"✓";color:var(--ok);font-weight:700}
.plan.v li:before{color:var(--gold)}
.plan li.no{opacity:.5}
.plan li.no:before{content:"–";color:inherit}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);background:#2b3459;color:#fff;padding:11px 22px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:20}
.toast.on{opacity:1;transform:translateX(-50%)}
.auth{max-width:440px;margin:24px auto}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.link{background:none;border:0;color:#9d97ff;font-weight:600;text-decoration:underline}.swt{text-align:center;margin-top:16px;color:var(--soft)}.exp{background:var(--tint);border-radius:12px;padding:12px 16px;margin-top:6px;font-size:.95rem}.exp b,.why b{color:var(--gold)}.rv{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px 20px;margin-top:12px}.q2{font-weight:600;margin-bottom:6px}.no{color:var(--bad)}.yes{color:var(--ok)}.why{color:var(--soft);font-size:.92rem;margin-top:6px}
.msg{min-height:1.5em;margin:12px 0;color:var(--bad);font-weight:500}.msg.ok{color:var(--ok)}.gear{display:grid;place-items:center;padding:6px 10px!important}.gear svg{width:20px;height:20px}input:disabled{opacity:.6}.panel h3{margin-bottom:6px}.btn:disabled{opacity:.6;cursor:default}
@media(max-width:760px){.hero{grid-template-columns:1fr;gap:26px}.flip3d{height:250px}.bar{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<script>
const SB_URL='https://vhneqagslodfbxjplnks.supabase.co',SB_KEY='sb_publishable_1_2IECdJWQhwPpHXeQApfw_rDcQiRkQ';
const sb=supabase.createClient(SB_URL,SB_KEY);
let user=null,decks=[],cur='auth',S=null,Q=null,mode='login',pend='';

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2400)}

const tabs=[['home','الرئيسية'],['decks','مجموعاتي'],['imp','ارفع ملف'],['create','يدوياً'],['vip','VIP']];
function go(v,id){
  if(!user&&v!=='verify'&&v!=='forgot')v='auth';cur=v;
  $('#nav').innerHTML=user?tabs.map(([k,t])=>`<button class="${k==='vip'?'vip ':''}${k===v?'on':''}" onclick="go('${k}')">${t}</button>`).join('')+GEAR(v):'';

/* ---------- الحساب ---------- */
const field=(id,l,t)=>`<label for="${id}">${l}</label><input type="${t||'text'}" id="${id}" dir="auto" autocomplete="${t==='password'?(mode==='signup'?'new-password':'current-password'):'on'}">`;
function auth(){
  const su=mode==='signup';
  return `<div class="auth"><div class="panel"><h2>${su?'إنشاء حساب':'تسجيل الدخول'}</h2><p class="sub">${su?'أنشئ حسابك لتحويل ملفاتك الدراسية إلى بطاقات واختبارات.':'سجّل الدخول للوصول إلى مجموعاتك ومتابعة المذاكرة.'}</p>
  ${su?field('name','الاسم الكامل')+field('username','اسم المستخدم')+field('email','البريد الإلكتروني','email')+field('uni','الجامعة'):field('email','البريد الإلكتروني','email')}
  ${field('pw','كلمة السر','password')}${su?'':'<p style="margin:8px 0 0"><button class="link" onclick="go(\'forgot\')">نسيت كلمة السر؟</button></p>'}
  <p class="err" id="er"></p><button class="btn" id="ab" style="width:100%" onclick="submitAuth()">${su?'إنشاء الحساب':'دخول'}</button>
  <p class="swt">${su?'لديك حساب بالفعل؟':'ليس لديك حساب؟'} <button class="link" onclick="mode='${su?'login':'signup'}';go('auth')">${su?'تسجيل الدخول':'أنشئ حساباً'}</button></p></div></div>`;
}
const msg=e=>/different from the old/i.test(e.message)?'كلمة السر الجديدة يجب أن تختلف عن القديمة.':/invalid login/i.test(e.message)?'البريد أو كلمة السر غير صحيحة.':/rate limit|too many/i.test(e.message)?'محاولات كثيرة، انتظر قليلاً ثم أعد المحاولة.':/database error/i.test(e.message)?'اسم المستخدم غير متاح، اختر اسماً آخر.':'حدث خطأ، تأكد من الإنترنت وحاول مرة أخرى. ('+(e.message||e)+')';
async function submitAuth(){
  const v=id=>$('#'+id)?$('#'+id).value.trim():'',er=$('#er'),b=$('#ab'),p=$('#pw').value,email=v('email').toLowerCase();
  const t0=b.textContent,fail=m=>{er.textContent=m;b.disabled=false;b.textContent=t0};
  er.textContent='';
  if(!/^\S+@\S+\.\S+$/.test(email)){er.textContent='البريد الإلكتروني غير صحيح.';return}
  if(mode==='signup'){
    const u={name:v('name'),username:v('username').toLowerCase(),uni:v('uni')};
    if(!u.name||!u.uni){er.textContent='أكمل الاسم والجامعة.';return}
    if(!/^[a-z0-9_]{3,20}$/.test(u.username)){er.textContent='اسم المستخدم: من 3 إلى 20 حرفاً إنجليزياً أو أرقاماً أو _';return}
    if(p.length<6){er.textContent='كلمة السر 6 أحرف على الأقل.';return}
    b.disabled=true;b.textContent='جارٍ إنشاء الحساب...';
    try{
      const{data:ok,error:e1}=await sb.rpc('username_available',{u:u.username});if(e1)throw e1;
      if(!ok)return fail('اسم المستخدم غير متاح، اختر اسماً آخر.');
      const{error}=await sb.auth.signUp({email,password:p,options:{data:{username:u.username,name:u.name,uni:u.uni}}});
      if(error)throw error;pend=email;go('verify');
    }catch(e){fail(msg(e))}
  }else{
    b.disabled=true;b.textContent='جارٍ تسجيل الدخول...';
    try{
      const{data,error}=await sb.auth.signInWithPassword({email,password:p});
      if(error){
        if(/not confirmed/i.test(error.message)){pend=email;await sb.auth.resend({type:'signup',email});go('verify');return}
        throw error;
      }
      await enter(data.user);
    }catch(e){fail(msg(e))}
  }
}
function verify(){
  return `<div class="auth"><div class="panel"><h2>أدخل رمز التحقق</h2><p class="sub">أرسلنا رمزاً إلى <b dir="ltr">${esc(pend)}</b>. إن لم يصل الرمز، تحقق من مجلد البريد غير الهام.</p>
  <label for="code">الرمز</label><input type="text" id="code" dir="ltr" inputmode="numeric" maxlength="10" autocomplete="one-time-code" style="letter-spacing:6px;text-align:center;font-size:1.4rem">
  <p class="err" id="er"></p><button class="btn" style="width:100%" id="vb" onclick="verifyCode()">تأكيد</button>
  <p class="swt"><button class="link" onclick="resend()">إعادة إرسال الرمز</button> · <button class="link" onclick="mode='login';go('auth')">رجوع</button></p></div></div>`;
}
async function verifyCode(){
  const er=$('#er'),b=$('#vb');b.disabled=true;b.textContent='جارٍ التحقق...';
  const{data,error}=await sb.auth.verifyOtp({email:pend,token:$('#code').value.trim(),type:'signup'});
  if(error){er.textContent='الرمز غير صحيح أو انتهت صلاحيته.';b.disabled=false;b.textContent='تأكيد';return}
  await enter(data.user);
}
async function resend(){const{error}=await sb.auth.resend({type:'signup',email:pend});toast(error?'انتظر قليلاً قبل إعادة الإرسال':'أُرسل رمز جديد')}
async function enter(au){
  const{data:p}=await sb.from('profiles').select('username,name,university').eq('id',au.id).maybeSingle();
  user={id:au.id,email:au.email,name:(p&&p.name)||'',username:(p&&p.username)||'',uni:(p&&p.university)||''};
  const{data:d}=await sb.from('decks').select('id,name,data').order('created_at');
  decks=(d||[]).map(r=>({id:r.id,name:r.name,...r.data}));
  go('home');
}
async function logout(){await sb.auth.signOut();user=null;decks=[];mode='login';go('auth')}
async function saveDeck(d){const{name,...data}=d;const{data:r,error}=await sb.from('decks').insert({name,data}).select('id').single();if(error)throw error;decks.push({id:r.id,name,...data})}
const say=(el,t,ok)=>{el.textContent=t;el.className='msg'+(ok?' ok':'')};
const GEAR=v=>`<button class="gear ${v==='settings'?'on':''}" onclick="go('settings')" aria-label="الإعدادات"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>`;
function forgot(){
  return `<div class="auth"><div class="panel"><h2>استعادة كلمة السر</h2><p class="sub" id="fs">أدخل بريدك الإلكتروني وسنرسل لك رمز التحقق.</p>
  <div id="f1">${field('femail','البريد الإلكتروني','email')}<p class="err" id="er"></p><button class="btn" id="fb" style="width:100%" onclick="sendReset()">إرسال الرمز</button></div>
  <div id="f2" hidden>${field('fcode','رمز التحقق')}${field('np','كلمة السر الجديدة','password')}${field('np2','تأكيد كلمة السر الجديدة','password')}<p class="err" id="er2"></p><button class="btn" id="rb" style="width:100%" onclick="resetPass()">تغيير كلمة السر</button></div>
  <p class="swt"><button class="link" onclick="mode='login';go('auth')">الرجوع لتسجيل الدخول</button></p></div></div>`;
}
async function sendReset(){
  const er=$('#er'),b=$('#fb'),em=$('#femail').value.trim().toLowerCase();
  if(!/^\S+@\S+\.\S+$/.test(em)){er.textContent='البريد الإلكتروني غير صحيح.';return}
  er.textContent='';b.disabled=true;b.textContent='جارٍ الإرسال...';

  b.disabled=false;b.textContent='إرسال الرمز';

  pend=em;$('#f1').hidden=true;$('#f2').hidden=false;
  $('#fs').textContent='إن كان البريد '+em+' مسجلاً لدينا فقد أرسلنا إليه رمزاً. أدخله مع كلمة السر الجديدة.';

async function resetPass(){
  const er=$('#er2'),b=$('#rb'),c=$('#fcode').value.trim(),p=$('#np').value,p2=$('#np2').value;
  if(!c){er.textContent='أدخل رمز التحقق.';return}
  if(p.length<6){er.textContent='كلمة السر 6 أحرف على الأقل.';return}
  if(p!==p2){er.textContent='كلمتا السر غير متطابقتين.';return}
  er.textContent='';b.disabled=true;b.textContent='جارٍ تغيير كلمة السر...';
  const back=m=>{er.textContent=m;b.disabled=false;b.textContent='تغيير كلمة السر'};
  const{error}=await sb.auth.verifyOtp({email:pend,token:c,type:'recovery'});
  if(error)return back('الرمز غير صحيح أو انتهت صلاحيته.');
  const{data,error:e2}=await sb.auth.updateUser({password:p});
  if(e2)return back(msg(e2));
  toast('تم تغيير كلمة السر');await enter(data.user);

const sf=(id,l,v,d,x)=>`<label for="${id}">${l}</label><input type="text" id="${id}" value="${esc(v)}" dir="${d||'auto'}" ${x||''}>`;
const sp=(id,l)=>`<label for="${id}">${l}</label><input type="password" id="${id}" autocomplete="${id==='op'?'current-password':'new-password'}">`;
function settings(){
  return `<h2 style="margin-top:12px">الإعدادات</h2>
  <div class="panel"><h3>الملف الشخصي</h3>${sf('sn','الاسم الكامل',user.name)}${sf('su','اسم المستخدم',user.username,'ltr')}${sf('sm','البريد الإلكتروني',user.email,'ltr','disabled')}<p class="why" style="margin-top:4px">لا يمكن تغيير البريد الإلكتروني حالياً.</p>${sf('sc','الجامعة',user.uni)}<p class="msg" id="m1"></p><button class="btn" id="sb1" onclick="saveProfile()">حفظ التعديلات</button></div>
  <div class="panel"><h3>تغيير كلمة السر</h3>${sp('op','كلمة السر الحالية')}${sp('p1','كلمة السر الجديدة')}${sp('p2','تأكيد كلمة السر الجديدة')}<p class="msg" id="m2"></p><button class="btn" id="sb2" onclick="changePass()">تغيير كلمة السر</button></div>
  <div class="panel"><h3>الحساب</h3><p class="sub" style="margin-bottom:14px">${esc(user.email)}</p><button class="btn alt" onclick="logout()">تسجيل الخروج</button></div>`;
}
async function saveProfile(){
  const m=$('#m1'),b=$('#sb1'),n=$('#sn').value.trim(),u=$('#su').value.trim().toLowerCase(),c=$('#sc').value.trim();
  if(!n||!c)return say(m,'أكمل الاسم والجامعة.');
  if(!/^[a-z0-9_]{3,20}$/.test(u))return say(m,'اسم المستخدم: من 3 إلى 20 حرفاً إنجليزياً أو أرقاماً أو _');
  say(m,'');b.disabled=true;b.textContent='جارٍ الحفظ...';
  const{data,error}=await sb.from('profiles').update({username:u,name:n,university:c}).eq('id',user.id).select('id');
  b.disabled=false;b.textContent='حفظ التعديلات';
  if(error)return say(m,error.code==='23505'?'اسم المستخدم غير متاح، اختر اسماً آخر.':'تعذر الحفظ، حاول مرة أخرى.');
  if(!data||!data.length)return say(m,'تعذر الحفظ، حاول مرة أخرى.');
  user.name=n;user.username=u;user.uni=c;say(m,'تم حفظ التعديلات',1);
}
async function changePass(){
  const m=$('#m2'),b=$('#sb2'),o=$('#op').value,p=$('#p1').value,p2=$('#p2').value;
  if(!o)return say(m,'أدخل كلمة السر الحالية.');
  if(p.length<6)return say(m,'كلمة السر الجديدة 6 أحرف على الأقل.');
  if(p!==p2)return say(m,'كلمتا السر الجديدتان غير متطابقتين.');
  if(p===o)return say(m,'كلمة السر الجديدة يجب أن تختلف عن الحالية.');
  say(m,'');b.disabled=true;b.textContent='جارٍ تغيير كلمة السر...';
  const back=t=>{b.disabled=false;b.textContent='تغيير كلمة السر';say(m,t)};
  const{error:e1}=await sb.auth.signInWithPassword({email:user.email,password:o});
  if(e1)return back('كلمة السر الحالية غير صحيحة.');
  const{error}=await sb.auth.updateUser({password:p});
  if(error)return back(msg(error));
  b.disabled=false;b.textContent='تغيير كلمة السر';
  ['op','p1','p2'].forEach(i=>$('#'+i).value='');say(m,'تم تغيير كلمة السر بنجاح',1);
}
async function init(){
  $('#app').innerHTML='<p class="sub" style="text-align:center;margin:60px auto">جارٍ التحميل...</p>';
  const{data}=await sb.auth.getSession();
  if(data.session)await enter(data.session.user);else go('auth');
}

/* ---------- الصفحات ---------- */
function home(){
  return `<section class="hero"><div><h1>ذاكر أقل،<br>واحفظ أكثر</h1>
  <p class="sub">ارفع ملف PDF أو PowerPoint، واختر عدد البطاقات والأسئلة، وراجع أخطاءك مع الشرح.</p>
  <div class="row"><button class="btn" onclick="go('imp')">ارفع ملفك</button><button class="btn alt" onclick="go('decks')">مجموعاتي</button></div></div>
  <div class="scene"><button class="flip3d" onclick="this.classList.toggle('on')" aria-label="اقلب البطاقة"><div class="face front"><small>ملفك</small>محاضرة من 60 صفحة؟</div><div class="face back"><small>Quizora</small>تتحول إلى بطاقات وأسئلة في ثوانٍ</div></button><p class="hint">اضغط على البطاقة لتقلبها</p></div></section>`;
}
function deckList(){
  return `<div class="head"><div><h2>مجموعاتي</h2><p class="sub">اختر مجموعة وابدأ المذاكرة أو الاختبار.</p></div><button class="btn" onclick="go('imp')">ارفع ملفاً</button></div>
  ${decks.length?`<div class="grid">${decks.map(d=>`<article class="deck"><h3>${esc(d.name)}</h3><p>${d.cards.length} بطاقة${d.qz?' · '+d.qz.length+' سؤال':''}</p><div class="row"><button class="btn sm" onclick="go('study','${d.id}')">ذاكر</button><button class="btn sm alt" onclick="go('quiz','${d.id}')">اختبرني</button><button class="btn sm alt" onclick="del('${d.id}')">حذف</button></div></article>`).join('')}</div>`
  :`<div class="empty">لا توجد مجموعات بعد.<br><br><button class="btn" onclick="go('imp')">ارفع أول ملف</button></div>`}`;
}
async function del(id){const d=decks.find(x=>x.id===id);if(d&&confirm('حذف "'+d.name+'"؟')){const{error}=await sb.from('decks').delete().eq('id',id);if(error){toast('تعذر الحذف');return}decks=decks.filter(x=>x.id!==id);go('decks')}}

function create(){
  return `<h2 style="margin-top:12px">مجموعة يدوية</h2><p class="sub">اكتب كل بطاقة في سطر، وافصل بين السؤال والإجابة بعلامة |</p><div class="panel">
  <label for="dn">اسم المجموعة</label><input type="text" id="dn">
  <label for="dc">البطاقات</label><textarea id="dc" placeholder="السؤال | الإجابة"></textarea><p class="err" id="er"></p><button class="btn" onclick="addDeck()">حفظ المجموعة</button></div>`;
}
async function addDeck(){
  const name=$('#dn').value.trim(),er=$('#er');
  const cards=$('#dc').value.split('\n').map(l=>{const i=l.indexOf('|');return i<0?null:[l.slice(0,i).trim(),l.slice(i+1).trim()]}).filter(c=>c&&c[0]&&c[1]);
  if(!name){er.textContent='اكتب اسماً للمجموعة.';return}
  if(!cards.length){er.textContent='أضف بطاقة واحدة على الأقل بصيغة: السؤال | الإجابة';return}
  try{await saveDeck({name,cards})}catch(e){er.textContent='تعذر الحفظ، تأكد من الإنترنت.';return}toast('تم حفظ المجموعة');go('decks');
}

/* ---------- رفع الملفات وتوليد الأسئلة ---------- */
function imp(){
  return `<h2 style="margin-top:12px">ارفع ملفك</h2><p class="sub">PDF أو PowerPoint (.pptx). الأسئلة تُستخرج من محتوى ملفك فقط.</p><div class="panel">
  <label for="f">الملف</label><input type="file" id="f" accept=".pdf,.pptx">
  <div class="two"><div><label for="nf">عدد الفلاش كارد</label><input type="number" id="nf" value="10" min="1" max="200"></div><div><label for="nq">عدد أسئلة الكويز</label><input type="number" id="nq" value="10" min="1" max="200"></div></div>
  <p class="err" id="er"></p><button class="btn" id="gb" onclick="gen()">حوّل الملف</button></div>`;
}
const lib=u=>new Promise((r,j)=>{const s=document.createElement('script');s.src=u;s.onload=r;s.onerror=()=>j(new Error('تعذر تحميل مكتبة القراءة، تأكد من الإنترنت.'));document.head.appendChild(s)});
async function readPdf(f){
  if(!window.pdfjsLib){await lib('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}
  const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let t='';
  for(let i=1;i<=Math.min(pdf.numPages,100);i++){const c=await(await pdf.getPage(i)).getTextContent();t+=c.items.map(x=>x.str+(x.hasEOL?'\n':' ')).join('')+'\n'}
  return t;
}
async function readPptx(f){
  if(!window.JSZip)await lib('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
  const z=await JSZip.loadAsync(f),ns=Object.keys(z.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>a.match(/\d+/)[0]-b.match(/\d+/)[0]);let t='';
  for(const n of ns)t+=(await z.files[n].async('string')).replace(/<\/a:p>/g,'\n').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&amp;/g,'&')+'\n';
  return t;
}
const STOP=new Set('this that with from have been were which their there about these those would could should after before between because however also into than then them they what when where while using used such other more most some many each both only very'.split(' '));
function makeItems(t){
  const seen=new Set(),out=[];
  t.replace(/[ \t]+/g,' ').split(/[.!?؟\n]+/).map(s=>s.trim()).filter(s=>s.length>=25&&s.length<=240).forEach(s=>{
    const m=s.match(/^(.{2,50}?)\s+(?:is|are|means|refers to|is defined as|هو|هي|هم|يعرف بأنه|تعرف بأنها|يسمى|تسمى|عبارة عن)\s+(.{12,})$/i);let it;
    if(m)it={k:'d',q:'ما المقصود بـ «'+m[1].trim()+'»؟',a:m[2].trim().slice(0,150),s};
    else{
      const w=(s.match(/[A-Za-z0-9\u0600-\u06FF][A-Za-z0-9\u0600-\u06FF\-]{3,}/g)||[]).filter(x=>!STOP.has(x.toLowerCase()));
      if(!w.length)return;
      const k=w.find(x=>/^[A-Z0-9]/.test(x)&&s.indexOf(x)>0)||w.sort((a,b)=>b.length-a.length)[0];
      it={k:'c',q:s.replace(k,'_____'),a:k,s};
    }
    if(!seen.has(it.a)){seen.add(it.a);out.push(it)}
  });
  return out;
}
async function gen(){
  const f=$('#f').files[0],er=$('#er'),nf=Math.max(1,+$('#nf').value||10),nq=Math.max(1,+$('#nq').value||10);
  if(!f){er.textContent='اختر ملف PDF أو PPTX.';return}
  const ext=f.name.split('.').pop().toLowerCase();
  if(ext!=='pdf'&&ext!=='pptx'){er.textContent='الصيغ المدعومة: PDF وPPTX.';return}
  const b=$('#gb');b.disabled=true;er.style.color='var(--soft)';er.textContent='جارٍ قراءة الملف...';
  try{
    const pool=makeItems(ext==='pdf'?await readPdf(f):await readPptx(f));
    if(pool.length<4)throw new Error('لم نجد نصاً كافياً. تأكد أن الملف نصي وليس صوراً ممسوحة.');
    const all=shuffle(pool).slice(0,Math.max(nf,nq));
    await saveDeck({name:f.name.replace(/\.\w+$/,''),cards:all.slice(0,nf).map(i=>[qtxt(i),i.a,i.s]),qz:all.slice(0,nq),ans:pool.map(i=>({a:i.a,k:i.k}))});
    toast(all.length<Math.max(nf,nq)?'الملف يكفي لـ '+all.length+' عنصراً فقط':'تم إنشاء المجموعة');go('decks');
  }catch(e){b.disabled=false;er.style.color='';er.textContent=e.message||'تعذرت قراءة الملف.'}
}

/* ---------- المذاكرة ---------- */
function study(id){
  const d=decks.find(x=>x.id===id);if(!d)return deckList();
  S={d,i:0,order:d.cards.map((_,i)=>i)};
  return `<div class="study"><div class="head" style="margin:0"><h2 style="font-size:1.3rem">${esc(d.name)}</h2><button class="btn sm alt" onclick="S.order=shuffle(S.order);S.i=0;draw()">خلط</button></div><div id="sv"></div></div>`;
}
function draw(){
  const c=S.d.cards[S.order[S.i]],n=S.order.length;
  $('#sv').innerHTML=`<div class="prog"><b style="width:${(S.i+1)/n*100}%"></b></div><div class="meta"><span>بطاقة ${S.i+1} من ${n}</span><span>مسافة للقلب · الأسهم للتنقل</span></div>
  <div class="scene" style="margin-top:14px"><button class="flip3d" id="sc" onclick="this.classList.toggle('on')" aria-label="اقلب البطاقة"><div class="face front"><small>سؤال</small>${esc(c[0])}</div><div class="face back"><small>الإجابة</small>${esc(c[1])}</div></button></div>
  <div class="ctrl"><button class="btn alt" onclick="step(-1)" ${S.i===0?'disabled':''}>السابق</button><button class="btn alt" onclick="$('#sc').classList.toggle('on')">اقلب</button>
  ${S.i<n-1?'<button class="btn" onclick="step(1)">التالي</button>':`<button class="btn gold" onclick="go('quiz','${S.d.id}')">اختبر نفسك</button>`}</div>`;
}
const step=k=>{S.i=Math.max(0,Math.min(S.order.length-1,S.i+k));draw()};
document.addEventListener('keydown',e=>{
  if(cur!=='study'||!S||/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==='ArrowLeft')step(1);else if(e.key==='ArrowRight')step(-1);
  else if(e.key===' '){e.preventDefault();const s=$('#sc');s&&s.classList.toggle('on')}
});

/* ---------- الكويز ---------- */
function opts(it,d){
  const same=(d.ans||[]).filter(x=>x.k===it.k&&x.a!==it.a).map(x=>x.a);
  const rest=[...(d.ans||[]).map(x=>x.a),...d.cards.map(c=>c[1]),...decks.flatMap(x=>x.cards.map(c=>c[1]))].filter(a=>a!==it.a);
  return shuffle([it.a,...[...new Set([...shuffle(same),...shuffle(rest)])].slice(0,3)]);
}
function quiz(id){
  const d=decks.find(x=>x.id===id);if(!d)return deckList();
  const base=d.qz||shuffle(d.cards).slice(0,10).map(c=>({q:c[0],a:c[1],s:c[2],k:'m'}));
  const list=shuffle(base).map(it=>({...it,o:opts(it,d)})).filter(x=>x.o.length>=3);
  if(list.length<1)return `<div class="empty">تحتاج إلى 4 إجابات مختلفة على الأقل لعمل اختبار.<br><br><button class="btn" onclick="go('imp')">ارفع ملفاً</button></div>`;
  Q={d,list,i:0,s:0,log:[]};
  return '<div class="quiz"><div id="qv"></div></div>';
}
function drawQ(){
  const n=Q.list.length;
  if(Q.i>=n){
    const p=Math.round(Q.s/n*100);
    $('#qv').innerHTML=`<div class="panel score"><div class="n">${Q.s}/${n}</div><h2>${p>=80?'ممتاز!':p>=50?'جيد، واصل المراجعة':'تحتاج مراجعة أكثر'}</h2><p class="sub" style="margin:0 auto 22px">نتيجتك في ${esc(Q.d.name)}: ${p}%</p><div class="row" style="justify-content:center"><button class="btn" onclick="go('quiz','${Q.d.id}')">اختبار جديد</button><button class="btn alt" onclick="go('study','${Q.d.id}')">راجع البطاقات</button></div></div>
    ${Q.log.length?`<h2 style="margin-top:28px">راجع أخطاءك (${Q.log.length})</h2>`+Q.log.map(l=>`<div class="rv"><p class="q2">${esc(qtxt(l.q))}</p><p class="no">إجابتك: ${esc(l.p)}</p><p class="yes">الصحيحة: ${esc(l.q.a)}</p>${l.q.s?`<p class="why">${expl(l.q)}</p>`:''}</div>`).join(''):'<p class="sub" style="text-align:center;margin:20px auto">أحسنت! لم ترتكب أي خطأ.</p>'}`;
    return;
  }
  const q=Q.list[Q.i];
  $('#qv').innerHTML=`<div class="prog"><b style="width:${Q.i/n*100}%"></b></div><div class="meta"><span>سؤال ${Q.i+1} من ${n}</span><span>الدرجة: ${Q.s}</span></div><p class="q">${esc(qtxt(q))}</p>${q.o.map((o,k)=>`<button class="opt" onclick="pick(${k})">${esc(o)}</button>`).join('')}<div id="nx"></div>`;
}
function pick(k){
  const q=Q.list[Q.i],ok=q.o[k]===q.a;
  if(ok)Q.s++;else Q.log.push({q,p:q.o[k]});
  document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(q.o[j]===q.a)b.classList.add('good');else if(j===k)b.classList.add('wrong')});
  $('#nx').innerHTML=(ok?'':`<div class="exp"><b>الإجابة الصحيحة:</b> ${esc(q.a)}${q.s?'<br>'+expl(q):''}</div>`)+`<button class="btn" style="margin-top:8px" onclick="Q.i++;drawQ()">${Q.i<Q.list.length-1?'السؤال التالي':'اعرض النتيجة'}</button>`;
}

function vip(){
  return `<div style="text-align:center;margin-top:12px"><h2>Quizora VIP</h2><p class="sub" style="margin:auto">قريباً: أدوات ذكية توفّر وقتك في المذاكرة.</p></div><div class="plans">
  <div class="plan"><h3>مجاني</h3><div class="price">0<small> دائماً</small></div><ul><li>رفع ملفات وتوليد بطاقات</li><li>كويزات مع تصحيح وشرح</li><li class="no">أسئلة بالذكاء الاصطناعي</li><li class="no">استخدام بدون إنترنت</li></ul><button class="btn alt" onclick="go('imp')">ابدأ مجاناً</button></div>
  <div class="plan v"><h3>VIP</h3><div class="price">$4.99<small> / شهرياً</small></div><ul><li>كل ميزات المجاني</li><li>أسئلة أذكى بالذكاء الاصطناعي</li><li>مراجعة بالتكرار المتباعد</li><li>بدون إعلانات وبدون إنترنت</li></ul><button class="btn gold" onclick="toast('سنخبرك عند الإطلاق')">انضم لقائمة الانتظار</button></div></div>`;
}
init();
</script>
